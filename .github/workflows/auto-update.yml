name: Auto-update NGINX Plus directives

# Runs every Sunday at 6am UTC. Can also be triggered manually.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually? (e.g., 'NGINX Plus R36 just dropped')"
        required: false
        default: "Manual check"

# id-token: write is required by anthropics/claude-code-action@v1
# (it mints a short-lived OIDC token for the Claude API even when an
# anthropic_api_key is supplied).
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Detect changes straight from the upstream source repos (no HTML scraping):
      #   nginx/documentation  content/nginx/releases.md  → new release sections
      #   nginx/nginx.org      xml/en/docs/**             → new Plus-only <directive>s
      # Baseline commits live in state/upstream-commits.json.
      - name: Diff upstream repos against last-processed commits
        id: check
        run: |
          python3 skills/nginx-plus-guide-updater/scripts/check-upstream.py > /tmp/upstream.json
          jq '{needs_update, latest_version, repos, new_releases: [.new_releases[].version], new_plus_directives: [.new_plus_directives[].directive]}' /tmp/upstream.json
          echo "latest_version=$(jq -r .latest_version /tmp/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "needs_update=$(jq -r .needs_update /tmp/upstream.json)" >> "$GITHUB_OUTPUT"
          cp /tmp/upstream.json "$RUNNER_TEMP/upstream.json"

      - name: Skip if an auto-update PR is already open
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEEDS="${{ steps.check.outputs.needs_update }}"
          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto-update/"))] | length')
          if [ "$NEEDS" = "true" ] && [ "$OPEN" != "0" ]; then
            echo "An auto-update PR is already open; not opening another."
            NEEDS=false
          fi
          echo "needs_update=$NEEDS" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────
      # The next step is where the Claude Code skill is invoked.
      # In the recommended setup, this calls Anthropic's claude-code-action.
      # See docs-meta/HOW-THE-AUTO-UPDATE-WORKS.md for the full pattern.
      # ──────────────────────────────────────────────────────────
      - name: Invoke the updater skill (Claude Code)
        if: steps.compare.outputs.needs_update == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the nginx-plus-guide-updater skill to process upstream NGINX Plus changes
            (latest release: ${{ steps.check.outputs.latest_version }}).
            The upstream diff has already been computed and is at ${{ runner.temp }}/upstream.json —
            read it first; do not re-scrape docs.nginx.com or nginx.org to detect changes.
            Follow the five-step workflow in skills/nginx-plus-guide-updater/SKILL.md.
            Open a pull request with the proposed changes.
          # Pass tool allow-list via claude_args (allowed_tools is no longer a top-level input on v1)
          claude_args: --allowed-tools "Bash,Read,Write,Edit,WebFetch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}

      - name: Summary
        run: |
          echo "### Auto-update run complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest version: ${{ steps.check.outputs.latest_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream changes found: ${{ steps.check.outputs.needs_update }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR drafted this run: ${{ steps.compare.outputs.needs_update }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
